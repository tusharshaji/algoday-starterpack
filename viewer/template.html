<head>

<meta name="color-scheme" content="dark">
<title>AlgoDay replay</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded as media=print first so it never blocks rendering: offline (or on
     a dead venue wifi) the page draws at once with system fonts. -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  /* The player's built-in palette (THEME in player.js), for the page around it. */
  :root {
    --bg: #050714;
    --panel: #0b1024;
    --line: #222d54;
    --fg: #f5f7ff;
    --muted: #8d98bc;
    --down: #ff6b7a;
    --accent: #7c6cff;
    --sans: "IBM Plex Sans", "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
    --mono: "IBM Plex Mono", "Cascadia Mono", Consolas, "SF Mono", Menlo, "Liberation Mono", monospace;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  #app {
    position: fixed;
    inset: 0;
  }
  #drop {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px;
    background: var(--bg);
  }
  #drop[hidden] {
    display: none;
  }
  body.dragging #drop {
    display: flex;
    background: color-mix(in srgb, var(--bg) 94%, transparent);
  }
  .brand {
    position: absolute;
    top: 22px;
    left: 24px;
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.16em;
    color: var(--muted);
  }
  .brand i {
    display: block;
    width: 12px;
    height: 12px;
    background: var(--accent);
  }
  .brand img {
    display: block;
    height: 20px;
    width: auto;
  }
  /* With the logo, the label is a wordmark behind a divider, as the player shows it. */
  .brand.logo span {
    padding-left: 0.9em;
    border-left: 1px solid var(--line);
    color: var(--fg);
    letter-spacing: 0.06em;
    text-shadow: 2px 2px 0 color-mix(in srgb, var(--accent) 70%, transparent);
  }
  .zone {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    box-sizing: border-box;
    width: min(540px, 100%);
    padding: 56px 24px 48px;
    border: 2px dashed var(--line);
    background: var(--panel);
    text-align: center;
    cursor: pointer;
  }
  .zone:hover,
  .zone:focus-within,
  body.dragging .zone {
    border-color: var(--accent);
  }
  .zone svg {
    width: 44px;
    height: 44px;
    color: var(--accent);
  }
  .zone .big {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .zone .small {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--muted);
  }
  .zone .btn {
    margin-top: 10px;
    padding: 10px 18px;
    background: var(--accent);
    color: var(--bg);
    font-size: 15px;
    font-weight: 600;
  }
  .zone input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
  }
  #drop-error {
    box-sizing: border-box;
    width: min(540px, 100%);
    padding: 10px 14px;
    border-left: 2px solid var(--down);
    background: var(--panel);
    color: var(--down);
    font-family: var(--mono);
    font-size: 14px;
    overflow-wrap: anywhere;
  }
  #drop-error[hidden] {
    display: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="drop" hidden>
  <div class="brand" id="drop-brand"><i></i><span>ALGODAY</span></div>
  <label class="zone">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" aria-hidden="true">
      <path d="M8 11V2.5M4.5 6 8 2.5 11.5 6M2.5 10.5v3h11v-3"/>
    </svg>
    <span class="big">Drop a replay</span>
    <span class="small">.algoday &middot; .json &middot; .json.gz</span>
    <span class="btn">Choose file</span>
    <input id="file" type="file" accept=".algoday,.json,.gz,application/json,application/gzip">
  </label>
  <div id="drop-error" role="alert" hidden></div>
</div>

<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var drop = document.getElementById("drop");
  var input = document.getElementById("file");
  var errorBox = document.getElementById("drop-error");
  var player = null;
  var dragDepth = 0;
  var LOGO_ALT = "TRV Trading × DEVS";
  var LABEL = "ALGO DAY";
  var logoNode = document.getElementById("algoreplay-logo");
  var logo = logoNode ? logoNode.textContent.trim() : "";
  if (logo.indexOf("data:image/") !== 0) {
    logo = "";
  }

  if (logo) {
    var brand = document.getElementById("drop-brand");
    var image = document.createElement("img");
    image.src = logo;
    image.alt = LOGO_ALT;
    image.draggable = false;
    brand.replaceChild(image, brand.querySelector("i"));
    brand.querySelector("span").textContent = LABEL;
    brand.className += " logo";
  }

  function showError(message) {
    errorBox.textContent = message || "";
    errorBox.hidden = !message;
  }

  function showDrop(message) {
    drop.hidden = false;
    showError(message);
  }

  // page.html?scale=1.25 makes all text and panels a quarter bigger (for a
  // projector whose text is too small; browser zoom barely helps)
  function pageOptions() {
    var options = {};
    if (logo) {
      options.brand = {logo: logo, logoAlt: LOGO_ALT, label: LABEL};
    }
    try {
      var scale = Number(new URLSearchParams(window.location.search).get("scale"));
      if (scale > 0) {
        options.scale = scale;
      }
    } catch (err) {
      // no URLSearchParams: the defaults
    }
    return options;
  }

  function start(replay) {
    if (player) {
      player.destroy();
      player = null;
    }
    try {
      player = window.AlgoReplay.mount(app, replay, pageOptions());
      drop.hidden = true;
      showError("");
      var meta = replay.meta || {};
      document.title = (meta.title || meta.round || "Replay") + " · AlgoDay replay";
    } catch (err) {
      player = null;
      showDrop(String((err && err.message) || err));
    }
  }

  function readFile(file) {
    file.arrayBuffer().then(function (buffer) {
      var bytes = new Uint8Array(buffer);
      var gzipped = bytes.length > 1 && bytes[0] === 0x1f && bytes[1] === 0x8b;
      if (!gzipped) {
        return new TextDecoder("utf-8").decode(bytes);
      }
      if (typeof DecompressionStream === "undefined") {
        throw new Error("This browser can't open .gz files. Unzip it first.");
      }
      var stream = new Blob([buffer]).stream().pipeThrough(new DecompressionStream("gzip"));
      return new Response(stream).text();
    }).then(function (text) {
      var replay;
      try {
        replay = JSON.parse(text);
      } catch (err) {
        throw new Error(file.name + " is not valid JSON.");
      }
      start(replay);
    }).catch(function (err) {
      if (player) {
        player.destroy();
        player = null;
      }
      showDrop(String((err && err.message) || err));
    });
  }

  input.addEventListener("change", function () {
    if (input.files && input.files[0]) {
      readFile(input.files[0]);
    }
    input.value = "";
  });

  // Dropping a file anywhere loads it, also over a replay that is playing.
  // A drag that starts inside the page (selected text, an image) is not a
  // file from outside, so it is left alone.
  var ownDrag = false;
  window.addEventListener("dragstart", function () {
    ownDrag = true;
  });
  window.addEventListener("dragend", function () {
    ownDrag = false;
  });
  window.addEventListener("dragenter", function (e) {
    if (ownDrag) {
      return;
    }
    e.preventDefault();
    dragDepth += 1;
    document.body.classList.add("dragging");
  });
  window.addEventListener("dragover", function (e) {
    if (!ownDrag) {
      e.preventDefault();
    }
  });
  window.addEventListener("dragleave", function () {
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) {
      document.body.classList.remove("dragging");
    }
  });
  window.addEventListener("drop", function (e) {
    e.preventDefault();
    dragDepth = 0;
    document.body.classList.remove("dragging");
    if (ownDrag) {
      ownDrag = false;
      return;
    }
    var files = e.dataTransfer && e.dataTransfer.files;
    if (files && files[0]) {
      readFile(files[0]);
    }
  });

  function embeddedReplay() {
    var node = document.getElementById("algoreplay-data");
    try {
      return JSON.parse(node.textContent);
    } catch (err) {
      return null;
    }
  }

  function boot() {
    if (!window.AlgoReplay) {
      showDrop("The replay player is missing from this page.");
      return;
    }
    var replay = embeddedReplay();
    if (replay) {
      start(replay);
    } else {
      showDrop("");
    }
  }

  if (window.AlgoReplay) {
    boot();
  } else {
    // The raw template (not written by viewer.py): load player.js next to it.
    var script = document.createElement("script");
    script.src = "player.js";
    script.onload = boot;
    script.onerror = boot;
    document.head.appendChild(script);
  }
})();
</script>
</body>
</html>
